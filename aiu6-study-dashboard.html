<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIU6 Study Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #242836;
  --border: #2e3346;
  --text: #e4e6f0;
  --text-dim: #8b90a5;
  --accent: #6ee7b7;
  --accent2: #818cf8;
  --accent3: #f472b6;
  --warn: #fbbf24;
  --red: #f87171;
  --radius: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

.header {
  padding: 2rem 2rem 1rem;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(135deg, #0f1117 0%, #1a1d27 100%);
}

.header h1 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.6rem;
  color: var(--accent);
  letter-spacing: -0.5px;
}

.header p { color: var(--text-dim); margin-top: 0.3rem; font-size: 0.9rem; }

.stats-bar {
  display: flex; gap: 1.5rem; margin-top: 1rem; flex-wrap: wrap;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.6rem 1rem;
  font-size: 0.82rem;
}

.stat strong { color: var(--accent); font-family: 'JetBrains Mono', monospace; }

.tabs {
  display: flex; gap: 0; border-bottom: 1px solid var(--border);
  background: var(--surface);
  overflow-x: auto;
}

.tab {
  padding: 0.8rem 1.4rem;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}

.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.content { padding: 1.5rem 2rem 3rem; max-width: 1100px; }

.topic-group {
  margin-bottom: 2rem;
}

.topic-group-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 1.05rem;
  color: var(--accent2);
  margin-bottom: 0.8rem;
  display: flex; align-items: center; gap: 0.5rem;
}

.topic-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 0.6rem;
  overflow: hidden;
  transition: border-color 0.2s;
}

.topic-card:hover { border-color: var(--accent); }

.topic-header {
  padding: 0.8rem 1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.8rem;
  user-select: none;
}

.topic-header .arrow {
  color: var(--text-dim);
  font-size: 0.7rem;
  transition: transform 0.2s;
  flex-shrink: 0;
}

.topic-card.open .arrow { transform: rotate(90deg); }

.topic-name {
  font-weight: 600;
  font-size: 0.92rem;
  flex: 1;
}

.badges { display: flex; gap: 0.4rem; flex-shrink: 0; flex-wrap: wrap; }

.badge {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 0.15rem 0.5rem;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
}

.badge.slide { background: #818cf822; color: var(--accent2); }
.badge.exercise { background: #f472b622; color: var(--accent3); }
.badge.project { background: #6ee7b722; color: var(--accent); }
.badge.house { background: #fbbf2422; color: var(--warn); }

.priority {
  font-size: 0.7rem;
  font-weight: 700;
  padding: 0.15rem 0.45rem;
  border-radius: 4px;
  flex-shrink: 0;
}

.priority.high { background: #f8717133; color: var(--red); }
.priority.med { background: #fbbf2433; color: var(--warn); }
.priority.low { background: #6ee7b722; color: var(--accent); }

.topic-body {
  display: none;
  padding: 0 1rem 1rem;
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.7;
}

.topic-card.open .topic-body { display: block; }

.topic-body h4 {
  color: var(--text);
  font-size: 0.82rem;
  margin: 0.8rem 0 0.3rem;
  font-family: 'JetBrains Mono', monospace;
}

.topic-body h4:first-child { margin-top: 0.2rem; }

.topic-body code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--surface2);
  padding: 0.1rem 0.35rem;
  border-radius: 3px;
  font-size: 0.78rem;
  color: var(--accent);
}

.topic-body .ref {
  display: inline-block;
  font-size: 0.75rem;
  color: var(--accent3);
  margin-right: 0.5rem;
}

.gap-flag {
  background: #f8717118;
  border-left: 3px solid var(--red);
  padding: 0.5rem 0.8rem;
  margin-top: 0.5rem;
  border-radius: 0 6px 6px 0;
  font-size: 0.8rem;
  color: var(--red);
}

.section-intro {
  color: var(--text-dim);
  font-size: 0.88rem;
  margin-bottom: 1.5rem;
  line-height: 1.7;
}

.day-plan {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.2rem;
  margin-bottom: 1rem;
}

.day-plan h3 {
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent);
  font-size: 1rem;
  margin-bottom: 0.6rem;
}

.day-plan p, .day-plan li {
  font-size: 0.85rem;
  color: var(--text-dim);
  line-height: 1.7;
}

.day-plan ul { padding-left: 1.2rem; }
.day-plan li { margin-bottom: 0.3rem; }

.checklist { list-style: none; padding: 0; }

.checklist li {
  display: flex; align-items: flex-start; gap: 0.5rem;
  padding: 0.3rem 0;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.checklist input[type="checkbox"] {
  margin-top: 0.3rem;
  accent-color: var(--accent);
}

.filter-bar {
  display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;
}

.filter-btn {
  font-size: 0.75rem;
  font-weight: 600;
  padding: 0.3rem 0.7rem;
  border-radius: 5px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  transition: all 0.2s;
  font-family: 'JetBrains Mono', monospace;
}

.filter-btn:hover, .filter-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: #6ee7b710;
}

@media (max-width: 600px) {
  .content { padding: 1rem; }
  .header { padding: 1rem; }
  .stats-bar { gap: 0.5rem; }
  .stat { padding: 0.4rem 0.6rem; font-size: 0.75rem; }
}
</style>
</head>

<strong>Supervised</strong>: labeled data → classification (discrete) or regression (continuous). <strong>Unsupervised</strong>: no labels → clustering, association, dimensionality reduction. <strong>Semi-supervised</strong>: partially labeled. <strong>Reinforcement</strong>: agent + environment + reward signal.

const quizQuestions = [
  { q: "What's the difference between classification and regression?", a: "Classification predicts discrete categories (labels), regression predicts continuous numbers. Different loss functions: cross-entropy vs MSE. Different output activations: softmax/sigmoid vs linear." },
  { q: "What is overfitting and how do you prevent it?", a: "Model memorizes training data, performs poorly on new data. Signs: train loss decreases but val_loss increases. Prevent with: Dropout, EarlyStopping, more data, simpler model, regularization (L1/L2), cross-validation." },
  { q: "Why can't you shuffle time series data for train/test split?", a: "Because the model would learn from future data to predict the past — that's data leakage. Time series must be split chronologically: train on past, test on future." },
  { q: "What does the Embedding layer do?", a: "Converts integer indices into dense vectors. Learns meaningful representations — similar items get similar vectors. Replaces one-hot encoding which is sparse and doesn't capture relationships." },
  { q: "Explain return_sequences=True vs False in LSTM.", a: "True: returns output at every timestep (shape: batch×timesteps×units). Use when stacking another RNN layer on top. False: returns only the last timestep's output (shape: batch×units). Use for the final RNN layer before Dense." },
  { q: "What is the temperature parameter in text generation?", a: "Controls randomness of predictions. Low temp (0.2): model picks highest probability → repetitive. High temp (1.2): more random picks → creative but error-prone. It divides logits before softmax, flattening or sharpening the distribution." },
  { q: "What is data leakage and give an example.", a: "When information from outside the training set leaks into the model. Example: fitting MinMaxScaler on ALL data including test set — the scaler 'knows' the test set's min/max. Always fit_transform on train, transform-only on test." },
  { q: "What is sparse_categorical_crossentropy?", a: "Loss function for multiclass classification where labels are integers (0,1,2,3...) not one-hot vectors. Avoids creating huge one-hot matrices. If labels were one-hot, you'd use categorical_crossentropy instead." },
  { q: "What is K-Means and how do you choose K?", a: "Clustering algorithm: assign points to nearest centroid, recalculate centroids, repeat. Choose K with Elbow method: plot WCSS (inertia) vs K, pick the 'bend' where adding clusters gives diminishing returns." },
  { q: "What is Q-learning?", a: "RL algorithm that learns a Q-table: expected reward for each (state, action) pair. Agent explores to fill the table, then exploits high-Q actions. Update rule uses current reward + discounted future value. Gamma controls how much future matters." },
  { q: "How does EarlyStopping work?", a: "Monitors a metric (usually val_loss). If it doesn't improve for 'patience' epochs, training stops. restore_best_weights=True rolls back model to the epoch with best performance. Prevents overfitting and saves time." },
  { q: "What's the difference between SimpleRNN and LSTM?", a: "SimpleRNN has vanishing gradient problem — can't learn long-range dependencies. LSTM adds gates (forget, input, output) that control information flow, allowing it to remember or forget over long sequences." },
  { q: "What does fine-tuning a transformer mean?", a: "Taking a pre-trained model (e.g., DistilBERT, trained on Wikipedia) and continuing training on your specific task data with task-specific labels. Uses lower learning rate to avoid destroying pre-trained knowledge. Adds a classification head on top." },
  { q: "What is TF-IDF?", a: "Term Frequency × Inverse Document Frequency. TF: how often a word appears in a document. IDF: penalizes common words. High TF-IDF = word is frequent in this doc but rare overall — it's distinctive. Creates a sparse matrix." },
  { q: "What's the purpose of BatchNormalization?", a: "Re-standardizes values between layers (mean≈0, std≈1). Speeds up training convergence and can have a slight regularization effect. Placed after Dense layer, before or after activation." },
  { q: "Explain the sliding window approach for sequence data.", a: "Cut a long sequence into overlapping windows of fixed length. Each window is one training example (X), and the next value is the target (Y). E.g., 40 chars → predict char 41. Window slides by 'step' positions (e.g., step=3 to reduce redundancy)." },
];

function render() {
  const el = document.getElementById('content');
  switch(currentTab) {
    case 'map': el.innerHTML = renderMap(); break;
    case 'gaps': el.innerHTML = renderGaps(); break;
    case 'plan': el.innerHTML = renderPlan(); break;
    case 'quiz': el.innerHTML = renderQuiz(); break;
  }
}

function toggleCard(id) {
  document.getElementById(id).classList.toggle('open');
}

function setFilter(f) {
  activeFilter = f;
  render();
}

document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.classList.contains('tab')) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  currentTab = e.target.dataset.tab;
  activeFilter = 'all';
  render();
});

render();
</script>
</body>
</html>
